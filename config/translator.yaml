# Translator System Configuration
#
# All filesystem paths in this file are relative to the repository root.
# No API key is required: the host coding agent performs every translation
# stage and the Python layer is a deterministic support layer only.

project:
  name: "Multi-Agent Translation System EN<->AR"
  version: "1.0.0"
  source_lang: "en"
  target_lang: "ar"
  default_register: "MSA"
  supported_registers: ["MSA", "EGY", "GULF", "LEV"]

pipeline:
  max_iterations: 3
  quality_threshold: 85
  sequential: true
  glossary_injection: true

arabic:
  diacritics_policy: "remove"  # retain | remove | optional
  orthography_normalization: true
  plural_forms: ["zero", "one", "two", "few", "many", "other"]
  gender_agreement: true
  rtl_preservation: true
  code_block_protection: true

skills:
  en_lexicon:
    source: "open_english_wordnet_2025"
    format: "json"
    offline: true
  en_ar_bilingual:
    source: "wiktionary_dump"
    format: "xml"
    offline: true
  synonym_expansion:
    source: "roget_1911"
    format: "text"
    offline: true
  style_reference:
    sources:
      - "unesco_style_manual_2004"
      - "ausit_arabic_style_guide"
      - "mozilla_arabic_style_guide"
    offline: true
  datamuse_synonyms:
    # Optional, keyless network skill; never used in the default translation path.
    api_url: "https://api.datamuse.com/words"
    offline: false
    cache_enabled: true

evaluation:
  primary_metric: "COMET-MQM"
  secondary_metrics: ["chrF", "AL-BLEU"]
  tsr_threshold: 0.95
  human_eval: ["MQM", "DA", "MHP"]

glossary:
  format: "tbx"
  path: "data/glossary.tbx"
  # Inject the glossary at all seven sequential stages.
  injection_stages: ["analysis", "translator", "postedit", "reviewer", "editor", "judge", "consistency"]

dictionaries:
  data_dir: "data/dictionaries"
  cache_dir: "data/cache"
  wordnet_enabled: true
  wiktionary_enabled: true
  roget_enabled: true
  datamuse_enabled: true
  # Metered dictionaries are optional and disabled by default; never required.
  merriam_webster_key: null
  collins_key: null
  oxford_app_id: null
  oxford_app_key: null

# DEPRECATED / DISABLED — do not enable this section.
# The host coding agent performs every translation stage; src/llm_client.py is
# deprecated and is never called on the default path. These keys are retained
# only so older configurations keep loading. No API key is needed or requested.
llm:
  enabled: false
  provider: null
  model: null
  api_key: null  # deprecated: the host coding agent performs translation
  temperature: 0.3
  max_tokens: 2000

book:
  format_support: ["md", "txt", "epub", "docx", "pdf"]
  consistency_tracking: true
  character_registry: "data/characters.json"
  places_registry: "data/places.json"
  manifest: "data/manifest.json"
  output_dir: "outputs"
