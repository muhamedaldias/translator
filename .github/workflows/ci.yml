name: CI

# Key-free, offline-by-design: no secrets, no model downloads, no provider APIs.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest + pack validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Validate portable skill pack
        run: python scripts/validate_pack.py

      - name: Key-free brief smoke test
        run: |
          python src/pipeline.py --source "Hello world" --target ar --brief /tmp/brief.json
          python -c "import json; d=json.load(open('/tmp/brief.json', encoding='utf-8')); assert len(d['agent_prompts']) == 7; assert d['analysis']"
